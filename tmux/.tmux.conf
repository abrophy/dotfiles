# ── Prefix ──────────────────────────────────────────────
# Remap prefix from C-b to C-a (easier to reach)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── General ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g mouse on
set -g base-index 1           # windows start at 1
setw -g pane-base-index 1     # panes start at 1
set -g renumber-windows on    # renumber on close
set -sg escape-time 0         # no delay for vim
set -g focus-events on

# ── Vim-style navigation ─────────────────────────────────
setw -g mode-keys vi

# Pane splitting (intuitive)
# bind | split-window -h -c "#{pane_current_path}"
# bind - split-window -v -c "#{pane_current_path}"
# unbind '"'
# unbind %

# Vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode (vim-style) ────────────────────────────────
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind p paste-buffer

# ── Window management ────────────────────────────────────
bind c new-window -c "#{pane_current_path}"   # new window in cwd
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ── Status bar ───────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 60

# Catppuccin Mocha colours (or swap to Solarized below)
BG="#1e1e2e"
FG="#cdd6f4"
MUTED="#585b70"
ACCENT="#89b4fa"   # blue
GREEN="#a6e3a1"
YELLOW="#f9e2af"
RED="#f38ba8"

set -g status-style "bg=$BG,fg=$FG"
set -g status-left "#[bg=$ACCENT,fg=$BG,bold] #S #[bg=$BG,fg=$ACCENT]"
set -g status-right "#[fg=$MUTED]  %H:%M  #[fg=$GREEN]#{?window_zoomed_flag, ZOOM ,}#[fg=$ACCENT,bold] #h "

setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[fg=$ACCENT,bold] #I:#W #[fg=$BG]"
setw -g window-status-style          "fg=$MUTED"
setw -g window-status-current-style  "fg=$ACCENT"

set -g pane-border-style             "fg=$MUTED"
set -g pane-active-border-style      "fg=$ACCENT"

set -g message-style                 "bg=$BG,fg=$YELLOW"

# ── Plugins ──────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # persist sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save sessions
set -g @plugin 'christoomey/vim-tmux-navigator' # seamless vim/tmux nav

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# Initialise TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
